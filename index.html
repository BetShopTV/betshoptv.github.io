<!-- ====== STYLES (preserve visual look of v08) ====== -->
<style>
  /* ====== Tokens ====== */
  :root{
    --red:#ff0000; --ink:#2b2424; --beige:#bebab0; --white:#ffffff;
    --bd-thin:1px; --bd-thick:2px;
    --ff-cta:"Roboto Condensed", system-ui, -apple-system, Segoe UI, Arial, sans-serif;
    --ff-body:"Roboto SemiCondensed", system-ui, -apple-system, Segoe UI, Arial, sans-serif;
    --fs-h1:clamp(1.4rem,3vw,2rem); --fs-h2:clamp(1.1rem,2vw,1.3rem);
    --fs-p:clamp(.9rem,1.2vw,1rem); --fs-sm:clamp(.78rem,1vw,.9rem); --fs-menu:clamp(.8rem,1.03vw,1.08rem);
    --gap-xxs:4px; --gap-xs:6px; --gap-s:8px; --gap-m:12px; --gap-l:16px;
    --app-max-width:1200px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--beige);color:var(--ink);font-family:var(--ff-body);-webkit-font-smoothing:antialiased} 

  /* ====== Header (mantém visual v08) ====== */
  header{position:sticky;top:0;z-index:10;background:var(--red);color:#fff;}
  .hdr-inner{max-width:var(--app-max-width);margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
/* PATCH: logo como imagem, mantendo o mesmo “peso visual” do título anterior */
.logo{
  display:flex; align-items:center; gap:8px;
  text-decoration:none;
}
.logo img{
  display:block;
  height: clamp(88px, 6.9vw, 224px); /* cresce um pouco em telas largas */
  width: auto;
  margin-left: 8px;
}

  .nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.nav a {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  font-size: clamp(12px, 2vw, 18px);
  color: #ff0000;

}

  .nav a:hover{

  }
  .nav a.active {
background:#ff0000;color:white;border: 1px solid white;
}

  /* ====== Área da página ====== */
main#app{max-width:var(--app-max-width);margin:20px auto;padding:0 6px;min-height:60vh}
  section{margin-bottom:24px}
  h2{font:700 var(--fs-h2)/1.2 var(--ff-cta);margin:0 0 8px}
  .botao-txt a{display:inline-flex;align-items:center;justify-content:center;color:#ffffff;text-decoration:none;
padding: clamp(8px, 3.8vw, 38px) clamp(12px, 3vw, 27px);
height: clamp(48px, 7vh, 72px);
font-weight: 700;
font-size: clamp(27px, 6.9vw, 42px);
letter-spacing: clamp(1.3px, 0.42vw, 2.4px); 
text-transform:uppercase; 
background-color: #ff0000;

  background-repeat: repeat;
  }
  .botao-txt a:hover{
  background: #2b2424;     /* bege ativo */

  border-color: #2b2424;   /* borda bege pra integrar */
  }
  /* ====== Galeria (Masonry / Pinterest) ====== */
  .galeria{
    column-gap:4px; -webkit-column-gap:4px;
    column-count:3; -webkit-column-count:3; /* 3 colunas por padrão */
    margin:4px; padding:4px;
  }
  .gal-item{
    display:inline-block; width:100%;
    break-inside:avoid; -webkit-column-break-inside:avoid;
    background:transparent; overflow:hidden;
  }
  .gal-item img{display:block;width:100%;height:auto;object-fit:cover;vertical-align:middle;background:transparent}

  /* Título fixo abaixo da imagem */
/* --- BARRA DE TÍTULO + STATUS UNIFICADA --- */
.gal-titulo {
  display: flex;               /* Ativa o modo flexível */
  justify-content: space-between; /* Título na esq, Status na dir */
  align-items: center;         /* Centraliza verticalmente */
  border: 1px solid #2b2424;
  width: 100%;
  background-color: transparent; /* Fundo da barra: Preto/Ink */
  color: var(--ink);          /* Cor do texto: Bege */
  font-family: var(--ff-cta);
  font-weight: 500;
  font-size: clamp(0.66em, 1vw, 0.88em);
  padding: 8px 10px;           /* Espaçamento interno */
  margin-top: -1px;            /* Cola na imagem */
  margin-bottom: 13px;
  box-sizing: border-box;
}

/* --- MARCADOR: VENDIDA (Bola Vermelha) --- */ 
/* O CSS insere automaticamente se o pai tiver a classe .sold */
.gal-item.sold .gal-titulo::after {
  content: '⬤';
  color: var(--red);
  font-size: 1.2em;
  margin-left: 4px; /* Afasta do título */
}

/* --- MARCADOR: ACERVO (Quadrado + Texto) --- */
/* O CSS insere automaticamente se o pai tiver a classe .acervo */
.gal-item.acervo .gal-titulo::after {
  content: 'ACERVO';
  color: var(--ink); /* Mantém beige para ler no fundo preto */
  background: white;
  padding: 2px 6px;
  font-size: clamp(0.66em, 1vw, 0.88em);
  letter-spacing: 0.04em;
  white-space: nowrap;
  margin-left: 4px;
}

.preco.acervo { color: var(--ink); }

  /* ====== Feed / Post ====== */
  .feed{display:flex;flex-direction:column;gap:var(--gap-s)}
  .post{border:var(--bd-thin) solid var(--ink);background:var(--beige);overflow:hidden;display:flex;flex-direction:column;}

  /* Carrossel */
  .carousel{
    display:flex;gap:var(--gap-xxs);
    overflow-x:auto;scroll-snap-type:x mandatory;
    padding:6px 12px;background:var(--beige);
    /* barra de rolagem inferior sempre visível e vermelha */
    scrollbar-color: var(--red) transparent;
  }
  .carousel::-webkit-scrollbar{height:8px; margin-top: 8px;border-radius:0;}
  .carousel::-webkit-scrollbar-track{background:var(--beige);border-radius:0;}
  .carousel::-webkit-scrollbar-thumb{background:var(--red)}
  .carousel-slide{flex:0 0 100%;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;background:var(--beige);}
  .carousel-slide img{
    width:100%; max-height:42vh; min-height:200px;
    object-fit:contain; background:var(--beige);
  }
  /* remove a barra de progresso antiga */
  .carousel-bar-wrap{display:none!important}

  .preco{flex:0 0 auto;font-weight:700;white-space:nowrap;align-self:flex-start;background:var(--beige);}
  .descricao{font-size:15px; font-weight: 700;color:var(--ink);background:var(--beige);}
  .tecnica{font-size:13px;color:var(--ink);background:var(--beige);}   /* será exibida acima das dimensões */

  /* Botões do post */
/* Container dos botões */
.meta .meta-footer {
  display: flex;
  justify-content: flex-end;
  gap: 12px;           /* Aumentei um pouco o gap para respirar */
  align-items: center; /* <--- O SEGREDO: Alinha verticalmente pelo centro */
}

/* Estilo base dos botões */
.btn {
  font-size: 13px;
  font-family: var(--ff-cta);
  font-weight: 700;
  padding: 8px 12px;
  cursor: pointer;
  border-radius: 0;
  /* Garante altura de linha consistente nos botões de texto */

}

/* Botão Adicionar/Comprar */
.add-btn {
  font-size: 13px;

  background: transparent;
  color: var(--red);
  display: inline-flex;

}

.add-btn.added {

}

/* Botão Favorito (Coração) */
/* Botão Favorito (Coração com GIF) */
.fav-btn {
  /* --- 1. Tamanho e Layout (MANTIDOS) --- */
  font-size: clamp(2.4rem, 2.4vw, 3rem);
  border: none;
  
  /* Alinhamento */
  margin-top: 0;
  padding: 12px;
  line-height: 1;
  display: flex;
  align-items: center;
  height: auto;
  cursor: pointer;
  
  /* Garante que o fundo da CAIXA seja transparente */
  background-color: transparent; 

  /* --- 2. Efeito GIF no Texto --- */
  
  /* Define o GIF */
  background-image: url('https://betshoptv.github.io/images/BGFAV.gif');
  background-repeat: repeat;
  background-size: auto;     /* Tamanho original */
  background-position: center;

  /* Recorta o fundo para aparecer APENAS dentro do coração */
  -webkit-background-clip: text;
  background-clip: text;

  /* Deixa a cor transparente para ver o GIF através dela */
  color: transparent;

  /* --- 3. Contorno --- */
  -webkit-text-stroke: 1.5px red;
}

/* Estado Ativo (Quando selecionado) */
.fav-btn.active {
   /* Remove o GIF e deixa vermelho sólido */
  /* Garante que o fundo da CAIXA seja transparente */
  background-color: transparent; 

  /* --- 2. Efeito GIF no Texto --- */
  
  /* Define o GIF */
  background-image: url('https://betshoptv.github.io/images/fofertas.gif');
  background-repeat: repeat;
  background-size: auto;     /* Tamanho original */
  background-position: center;

  /* Recorta o fundo para aparecer APENAS dentro do coração */
  -webkit-background-clip: text;
  background-clip: text;

  /* Deixa a cor transparente para ver o GIF através dela */
  color: transparent;

  /* --- 3. Contorno --- */
  -webkit-text-stroke: 3px red;
}

}


  /* ===== PATCH FOFILTROS ===== */

/* 1) Centralização e layout responsivo
   - Mobile-first: empilha (coluna)
   - >=1024px: tenta virar 1 linha (row + wrap)
*/
.filters-bar{
  /* já existia, reforçamos: */
  max-width: var(--app-max-width);
  margin: 0 auto;
  display: flex;
  flex-direction: column;   /* mobile */
  gap: 18px;
  padding: 2.4vh 0;
  align-items: center;      /* centraliza todo o bloco */
    
}

.filters-row{
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
  align-items: stretch;
  justify-content: center;  /* centraliza os itens de cada linha */
}

/* Em telas largas, as duas "linhas" viram irmãs lado a lado e tentam ficar em 1 linha */
@media (min-width: 1024px){
  .filters-bar{
    flex-direction: row;    /* row1 e row2 lado a lado */
    flex-wrap: wrap;
    justify-content: center;
  }
  .filters-row{
    flex: 0 1 auto;
    flex-wrap: wrap;
    justify-content: center;
  }
}

/* 2) Altura mais baixa dos botões com borda (chips) e dos selects */
.chip{
  /* tamanho mais enxuto */
  font: 700 calc(var(--fs-sm) * .90)/1 var(--ff-cta);
  padding: .26rem .50rem;     /* menos vertical */
  min-height: 30px;           /* de 36px -> 30px */
}
.select{
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  font: 700 calc(var(--fs-sm) * .90)/1 var(--ff-cta);
  padding: .22rem .50rem;     /* menos vertical */ 
  min-height: 30px;           /* de 36px -> 30px */
  line-height: 1.1;
}

/* 3) Remover “borda branca”/realce do select ao focar/clicar (todos os navegadores) */
.select:focus,
.select:focus-visible,
.select:-moz-focusring {
  outline: none !important;
  box-shadow: none !important;
  border-color: var(--ink) !important;
}

/* (Safari/WebKit) bloqueia halo azul no focus via mouse */
.select:focus:not(:focus-visible){
  outline: none !important;
  box-shadow: none !important;
}

/* 4) Borda do select/inputs nunca arredondada (reforço) */
.select{ border-radius: 0 !important; }

/* 5) Ajuste fino de gap em telas bem largas (opcional) */
@media (min-width: 1280px){
      .nav a {
  font-weight: 800;
  letter-spacing: 0.66px;
    }
    .filters-row{ gap: 8px 12px; }
}

.filters-group{
  display: inline-flex;
  align-items: stretch;
  flex-wrap: wrap;
  gap: 6px;
}

/* Altura enxuta (mantemos como você pediu) */
.chip{
  font: 700 calc(var(--fs-sm) * .90)/1 var(--ff-cta);
  padding: .26rem .50rem;
  min-height: 30px;
} 
.select{
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  font: 700 calc(var(--fs-sm) * .90)/1 var(--ff-cta);
  padding: .22rem .50rem;
  min-height: 30px;
  line-height: 1.1;
  border-radius: 0;
}

/* Remove halo/borda branca ao focar no select (todos os browsers) */
.select:focus,
.select:focus-visible,
.select:-moz-focusring{
  outline: none !important;
  box-shadow: none !important;
  border-color: var(--ink) !important;
}
/* Safari: foco via mouse não pinta nada */
.select:focus:not(:focus-visible){
  outline: none !important;
  box-shadow: none !important;
}


/* === FEED – Desktop: carrossel em faixa horizontal === */
@media (min-width: 1024px){
  /* faixa com rolagem horizontal e espaçamento fixo */
  .post .carousel{
    gap: 24px !important;                /* espaço entre imagens */
    scroll-snap-type: none;     /* mantém "grudinho" suave */
    padding: 12px 16px 16px;             /* um respiro embaixo da barra */
    overflow-x: auto;                    /* garante a barra horizontal */
  }

  /* cada slide só o tamanho do conteúdo (lado a lado) */
  .post .carousel-slide{
    flex: 0 0 auto !important;           /* NÃO ocupa 100% da largura */
    scroll-snap-align: none;             /* encaixa no início a cada arrasto */
  }

  /* imagem totalmente visível; 10% mais alta que hoje */
  .post .carousel-slide img{
    width: auto !important;              /* não esticar a 100% da faixa */
    height: auto;
    max-height: calc(42vh * 1.1);        /* +10% de altura no desktop */
    object-fit: contain;                  /* tudo visível dentro da faixa */
    display: block;
  }
}

/* ====== MODAL BASE ====== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(43, 36, 36, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

/* Estrutura: .modal-content + .modal-footer (opcional) */
.modal-content {
  background: var(--beige);
  color: var(--ink);
  padding: 38px 28px;
  border: 2px solid var(--ink);
  max-width: 88vw;
  width: 690px;
  font-size: 1rem;
  text-align: center;
  position: relative;
  max-height: 69vh;
  overflow-y: auto;
  scroll-behavior: smooth;
  margin-bottom: 0;
}

/* Se tiver rodapé fixo, o conteúdo sobe um pouco pra não esconder */
.modal-overlay.has-footer .modal-content {
  margin-bottom: 64px; /* espaço pro rodapé */
}

/* Scrollbar vertical */
.modal-content::-webkit-scrollbar {
  width: 8px;
}
.modal-content::-webkit-scrollbar-track {
  background: var(--beige);
}
.modal-content::-webkit-scrollbar-thumb {
  background: var(--red);
}

/* Botão fechar */
.modal-close {
  position: absolute;
  top: 6px;
  right: 4px;
  background: none;
  border: none;
  font-size: 1rem;
  font-family: "Roboto SemiCondensed", var(--ff-body), sans-serif;
  font-weight: 900;
  color: var(--white);
  cursor: pointer;
}

/* ====== Rodapé opcional ====== */
.modal-footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100vw;
  background: var(--beige);
  border-top: 2px solid var(--ink);
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  z-index: 10000;
}

.modal-footer button {
  flex: 1;
  font-weight: 600;
  border: none;
  cursor: pointer;
  background: transparent;
  padding: 10px;
  transition: background 0.2s;
}

.modal-footer .btn-skip:hover {
  background: rgba(0,0,0,0.05);
}

.modal-footer .btn-next {
  color: #fff;
  background: var(--red);
}

.modal-footer .btn-next:hover {
  background: #b00;
}

function shuffleArray(array) {

// Contraste por YIQ (usa #2b2424 como cor escura e #fff como clara)
const getContrastColor = (hexColor) => {
  try {
    if (!hexColor) return '#2b2424';
    let s = String(hexColor).trim();
    if (s.startsWith('#')) s = s.slice(1);
    if (s.length === 3) s = s.split('').map(ch => ch + ch).join('');
    if (s.length !== 6) return '#2b2424';
    const r = parseInt(s.substring(0, 2), 16);
    const g = parseInt(s.substring(2, 4), 16);
    const b = parseInt(s.substring(4, 6), 16);
    const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
    return (yiq >= 128) ? '#2b2424' : '#ffffff';
  } catch (e) { return '#2b2424'; }
};

function calculateRifaTotal(count){
  count = Number(count || 0);

  if (count % 2 === 0) return 25 * count;
  return 25 * (count - 1) + 30;
}

function getFilteredSortedList(source){

}

  // 2. ACERVO
  if (filtros.acervo) {
    lista = lista.filter(p => /acervo/i.test(String(p.status || '')));
  }
  
  // 3. INDISPONÍVEIS
  if (filtros.indisponiveis) {
    lista = lista.filter(p => String(p.status || '').trim().toLowerCase() !== 'x');
  }

  // 4. PROMOÇÃO (R$ 150)
  if (filtros.promo) {
    lista = lista.filter(p => Number(p.preco) === 150);
  }
  
  // 5. GRUPOS
  if (filtros.grupos && filtros.grupos.size > 0) {
    lista = lista.filter(p => filtros.grupos.has(String(p.id_peca || '').slice(0,2)));
  }

// 6. ORDENAÇÃO
  const groupKey = p => parseInt(String(p.id_peca || '').slice(0,2)) || 0;
  const numKey   = p => parseInt(p.id_peca) || 0;

  if (filtros.sort === 'price-asc') {
    lista.sort((a,b)=> (parseFloat(a.preco||0) - parseFloat(b.preco||0)));
  } else if (filtros.sort === 'price-desc') {
    lista.sort((a,b)=> (parseFloat(b.preco||0) - parseFloat(a.preco||0)));
  } else if (filtros.sort === 'group-asc') {
    lista.sort((a,b)=> (groupKey(a) - groupKey(b)) || (numKey(a) - numKey(b)));
  } else if (filtros.sort === 'random') {
    // 🛑 PARE! Não faz nada aqui. 
    // Respeita a ordem que veio do shuffleArray.
  } else { 
    // Fallback ('group-desc') - só ordena se NÃO for random
    lista.sort((a,b)=> (groupKey(b) - groupKey(a)) || (numKey(b) - numKey(a)));
  }

  return lista;
}

/* =============== RIFAS ================= */
function formatRifaLabelDOM(rawText){
  const t0 = (rawText || '').toString().trim();
  const frag = document.createDocumentFragment();
  if (!t0) { const s = document.createElement('span'); s.className = 'ln1'; s.textContent = ''; frag.appendChild(s); return frag; }

  // tokeniza (mantém '/')
  let tokens = t0.split(/\s+/).filter(Boolean);
  if (tokens.length >= 3 && tokens[1] === '/') {
    tokens = [ tokens.slice(0,3).join(' ') ].concat(tokens.slice(3));
  }
  if (tokens.length === 1) { const s1 = document.createElement('span'); s1.className = 'ln1'; s1.textContent = tokens[0]; frag.appendChild(s1); return frag; }

  const n = tokens.length;
  const lens = tokens.map(w=>w.length);
  const total = lens.reduce((a,b)=>a+b,0) + (n-1);
  const pref = new Array(n+1).fill(0);
  for(let i=0;i<n;i++) pref[i+1] = pref[i] + lens[i];
  const leftLen = (i)=> (i<=0?0:(pref[i] + (i-1)));

  let bestI = 1, bestDiff = Infinity;
  const minLeft=4, minRight=3;
  for(let i=1;i<n;i++){
    const L = leftLen(i), R = total-L, diff = Math.abs(L-R);
    const penalty = (L>=minLeft && R>=minRight) ? 0 : 20;
    if (diff+penalty < bestDiff) { bestDiff = diff+penalty; bestI = i; }
  }
  let part1 = tokens.slice(0,bestI).join(' ');
  let part2 = tokens.slice(bestI).join(' ');
  if (part2.length < minRight && bestI>1){
    bestI = Math.max(1,bestI-1);
    part1 = tokens.slice(0,bestI).join(' ');
    part2 = tokens.slice(bestI).join(' ');
  }
  const s1 = document.createElement('span'); s1.className = 'ln1'; s1.textContent = part1; frag.appendChild(s1);
  if (part2){ const s2 = document.createElement('span'); s2.className = 'ln2'; s2.textContent = part2; frag.appendChild(s2); }
  return frag;
}

if (page !== 'feed') {

}


  if (updateHash){
    let newHash = page;
    if (pieceId){
      const params = new URLSearchParams(); params.set('p', pieceId);
      newHash = `${page}?${params.toString()}`;

// === Atualiza o destaque ativo no menu do cabeçalho ===
function updateNavActive(forcedPage = null) {
  const { page } = parseHash();
  const current = forcedPage !== null ? forcedPage : page;

  document.querySelectorAll('.nav a').forEach(a => {
    const target = a.getAttribute('href').replace('#','');

    // Se estiver na home (sem hash ou #home), nenhum botão fica ativo
    if (!location.hash || current === 'home') {
      a.classList.remove('active');
    } else {
      a.classList.toggle('active', target === current);
    }
  });
}



function parseHash(){
  const raw = (location.hash || '').slice(1);
  if (!raw) return { page: 'galeria', params: new URLSearchParams() };
  const [pagePart, query] = raw.split('?');
  return { page: pagePart || 'galeria', params: new URLSearchParams(query || '') };
}

function handleHashChange() { 
  const { page, params } = parseHash();

// MUDANÇA: Se não tiver hash (raiz do site) ou for #home...
  // ... AGORA Carrega direto a GALERIA!
  if (!location.hash || page === 'home') { 
    showPage('galeria', { updateHash: false });
    updateNavActive('galeria'); // Mantém o botão da Galeria aceso
    return;
  }

  if (page === 'feed') {
    const p = params.get('p');
    if (p) showPage('feed', { updateHash: false, pieceId: p });
    else   showPage('feed', { updateHash: false });

  } else if (page === 'rifas') {
    showPage('rifas', { updateHash: false });

  } else if (page === 'sobre') {
    renderSobreProjeto();

  } else if (page === 'como') {
    renderComoFunciona();

  } else {
    showPage('galeria', { updateHash: false });
  }

  updateNavActive(page);
}



window.addEventListener('hashchange', handleHashChange);

  if (selecionadas.size > 0) parts.push(`${selecionadas.size}${nbsp}${selecionadas.size === 1 ? 'Peça' : 'Peças'}`);
  if (rifasSel.size > 0)     parts.push(`${rifasSel.size}${nbsp}${rifasSel.size === 1 ? 'Rifa' : 'Rifas'}`);
  if (favoritos.size > 0)    parts.push(`${favoritos.size}${nbsp}${favoritos.size === 1 ? 'Favorita' : 'Favoritas'}`);

  // Atualiza a Pill (texto pequeno)
  if (pill) {
    pill.textContent = parts.join(' · ');
    pill.style.display = parts.length ? 'inline-block' : 'none';
  }

  // --- LÓGICA DO BOTÃO PRINCIPAL (CTA) ---
  if (cta) {
    // Se tiver valor monetário
    if (totalGeral > 0) {
      cta.textContent = `APOSTAR ${fmt(totalGeral)}`;
      cta.disabled = false;
    } 
    // Se NÃO tem valor, mas tem Favoritas (Gratuito)
    else if (favoritos.size > 0) {
      cta.textContent = 'ENVIAR FAVORITAS';
      cta.disabled = false;
    } 
    // Se não tem nada
    else {
      cta.textContent = 'FAÇAM SUAS APOSTAS!';
      cta.disabled = true;
    }
  }

  // Atualiza cor do rodapé (Vermelho se tiver qualquer atividade, Preto se vazio)
  const footer = document.querySelector('footer');
  if (footer) {
    const temAtividade = (totalGeral > 0 || favoritos.size > 0);
    footer.classList.toggle('has-total', temAtividade);
    footer.classList.toggle('no-total', !temAtividade);
  }
}


function calcularTotal(){
  let total = 0;

  // Peças
  selecionadas.forEach(id => {
    const p = pecas.find(x => x.id_peca === id);
    if (p && p.preco) total += parseFloat(p.preco);
  });

  // Rifas: regra de paridade
  const nR = rifasSel.size || 0;
  const totalRifas = (nR <= 0) ? 0 : (nR % 2 === 0 ? 25*nR : 25*(nR-1)+30);
  total += totalRifas;

  totalGeral = total;

  // Atualiza hidden form (mantém duas casas para o form)
  const fTotal = document.getElementById('fTotal');
  if (fTotal) fTotal.value = totalGeral.toFixed(2);

  // Sincroniza CTA/pills após recalcular
  updatePills();
}

function openFeedAt(id){
  const tryScroll = ()=>{
    const el = document.getElementById('post-' + id);
    if (!el) return false;

    // remove foco automático (evita moldura azul)
    if (document.activeElement && document.activeElement.blur) {
      document.activeElement.blur();
    }

    // rola imediatamente, sem animação
    el.scrollIntoView({ behavior: 'auto', block: 'start' });

    // compensa a altura do cabeçalho fixo (ajuste fino)
    const headerHeight = document.querySelector('header')?.offsetHeight || 100;
    window.scrollBy(0, -headerHeight);

    return true;
  };

  if (document.getElementById('feedList')){
    if (!tryScroll()) setTimeout(tryScroll, 120);
  } else {
    renderFeed();
    setTimeout(tryScroll, 100);
  }
}

async function init(){
  try{

    localStorage.removeItem('BSTV_FAV'); favoritos.clear();

    const [rp, rr] = await Promise.all([
      fetch(PECAS_JSON_URL, { cache:'no-store' }),
      fetch(RIFAS_JSON_URL, { cache:'no-store' })
    ]);
    if (!rp.ok || !rr.ok) throw new Error('Falha ao carregar JSONs');

    pecas = await rp.json();
    rifas = await rr.json();

    // === GOLPE DE MESTRE: Embaralhar assim que carrega! ===
    shuffleArray(pecas); 

    // render inicial conforme hash
    attachAppDelegation();
    attachBindings();
    handleHashChange();

    updatePills();
    calcularTotal();
  }catch(e){
    console.error('Init error', e);
    document.getElementById('app').innerHTML =
      '<div style="padding:20px;color:#900;">Erro ao carregar dados. Veja o console.</div>';

}

let modalAtivo = null;

function abrirModal(el) {
  const id = el.dataset.modalId;
  const modal = document.getElementById(`modal-${id}`);
  if (!modal) return;

  fecharModal();
  modal.style.display = 'flex';
  modalAtivo = modal;

  modal.scrollTop = 0; // 👈 Corrige abertura “colada” ao clique

  document.addEventListener('keydown', fecharPorEsc);
  modal.addEventListener('click', cliqueFora);
}


function fecharModal() {
  if (!modalAtivo) return;

  modalAtivo.style.display = 'none';
  document.removeEventListener('keydown', fecharPorEsc);
  modalAtivo.removeEventListener('click', cliqueFora);
  modalAtivo = null;
}

function fecharPorEsc(e) {
  if (e.key === 'Escape') fecharModal();
}

function cliqueFora(e) {
  if (e.target === modalAtivo) fecharModal();
}


function escFecharModal(e) {
  if (e.key === 'Escape') fecharModalAgende();
}

function cliqueForaModal(e) {

(function(){
  // Usa a mesma URL do checkout
  const GAS_URL = typeof window.GAS_URL === 'string'
    ? window.GAS_URL
    : 'https://script.google.com/macros/s/AKfycbwOeHsHlwj_-lBpRKOPGq5GSkzslBS23tKhTwGLKwBICPeZGZ2_SVRxVEWqXNzhmcbY/exec';

  document.addEventListener('DOMContentLoaded', function(){
    const form = document.getElementById('form-agendar');
    if (!form) return;

    form.addEventListener('submit', async function(e){
      e.preventDefault();

      const nome  = (document.getElementById('ag_nome').value || '').trim();
      const email = (document.getElementById('ag_email').value || '').trim();
      const tel   = (document.getElementById('ag_telefone').value || '').trim();
      const msg   = (document.getElementById('ag_msg').value || '').trim();
      const btn   = document.getElementById('ag_enviar');
      const feed  = document.getElementById('ag_feedback');

      if (!nome || !email || !msg) {
        alert('Preencha nome, e-mail e a mensagem de agendamento.');
        return;
      }

      // Monta como o checkout, mas separado:
      // - tipo=AGENDAR
      // - pecas recebe a mensagem
      // - rifas/favoritas/total vazios
      const fd = new FormData();
      fd.append('tipo', 'AGENDAR');
      fd.append('nome', nome);
      fd.append('email', email);
      fd.append('telefone', tel);
      fd.append('pecas', msg);       // <- mensagem vai na coluna PECAS
      fd.append('rifas', '');
      fd.append('favoritas', '');
      fd.append('total', '');

      // UX básico
      const old = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try{
        const res = await fetch(GAS_URL, { method:'POST', body: fd });
        // Melhor esforço: se 200, consideramos OK
        if (res.ok) {
          feed.style.display = 'block';
          feed.style.color = 'red';
          feed.textContent = 'Agendamento enviado! Em breve entraremos em contato.';
          form.reset();
          // Você pode fechar o modal aqui, se preferir:
          // setTimeout(()=> fecharModalAgende(), 1200);
        } else {
          throw new Error('Falha ao enviar. Tente novamente.');
        }
      } catch(err){
        feed.style.display = 'block';
        feed.style.color = '#900';
        feed.textContent = 'Erro ao enviar. Tente novamente.';
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = old;
      }
    });
  });
})();

<script>
/* 🔧 Corrige o comportamento de rolagem nas âncoras da página
   — sempre alinha ao topo (exceto o Feed) */
(function(){
  document.addEventListener("click", function(e){
    const link = e.target.closest("a[href^='#']");
    if(!link) return;

    const targetId = link.getAttribute("href").substring(1);
    const targetEl = document.getElementById(targetId);

    // só atua em seções internas existentes
    if(!targetEl) return;

    // impede o comportamento padrão do navegador
    e.preventDefault();

    // exceção: feed deve manter o comportamento original
    if(targetId === "feed") {
      window.location.hash = "#feed";
      return;
    }

    // rola até o topo da seção com comportamento suave
    targetEl.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

    // força o hash na URL para manter o estado da página
    history.replaceState(null, "", "#" + targetId);
  });

  /* 🧩 adicional: se o usuário entra com uma âncora na URL,
     garante que ela alinhe ao topo também */
  window.addEventListener("load", () => {
    const id = location.hash.replace("#", "");
    const el = id && document.getElementById(id);
    if(el && id !== "feed"){
      setTimeout(() => el.scrollIntoView({ behavior: "auto", block: "start" }), 50);
    }
  });
})();
</script>

<script>
/* ======= FAVORITOS MODAL: mini galeria tipo masonry ======= */
function renderModalFavoritos(){
  const gal = document.getElementById('fav-galeria');
  const gruposWrap = document.getElementById('fav-grupos');
  if(!gal || !pecas?.length) return;

  // 🔹 construir botões de grupo dinamicamente
  gruposWrap.innerHTML = '';
  const gruposDisp = getGruposDisponiveis();
  gruposDisp.forEach(g=>{
    const b=document.createElement('button');
    b.className='chip';
    b.textContent=g;
    b.dataset.grp=g;
    b.addEventListener('click',()=>{
      const ativo=b.classList.toggle('is-active');
      if(!ativo) b.removeAttribute('aria-pressed');
      else b.setAttribute('aria-pressed','true');
      renderMiniGaleria(); // re-renderiza com grupos selecionados
    });
    gruposWrap.appendChild(b);
  });

  // primeiro render sem seleção (mostra todas)
  renderMiniGaleria();
}

function renderMiniGaleria(){
  const gal = document.getElementById('fav-galeria');
  const gruposAtivos = Array.from(document.querySelectorAll('#fav-grupos .chip.is-active'))
                            .map(b=>b.dataset.grp);
  gal.innerHTML = '';

  let lista = pecas.filter(p => !/vendid/i.test(p.status || ''));
  if(gruposAtivos.length){
    lista = lista.filter(p => gruposAtivos.includes(String(p.id_peca).slice(0,2)));
  }

  lista.forEach(p=>{
    const wrap=document.createElement('div');
    wrap.className='fav-item';
    const img = imgWithFallback(`https://betshoptv.github.io/img/tmb/${p.imagens[0]}.avif`);
    img.alt = p.titulo || p.id_peca;
    img.dataset.id = p.id_peca;
    if (favoritos.has(p.id_peca)) img.classList.add('fav-active');
    img.onclick = ()=>toggleFavModal(p.id_peca, img);
    wrap.appendChild(img);
    gal.appendChild(wrap);
  });
} 

function toggleFavModal(id, el){
  if (favoritos.has(id)) favoritos.delete(id);
  else favoritos.add(id);
  el.classList.toggle('fav-active');
  try { localStorage.setItem('BSTV_FAV', JSON.stringify([...favoritos])); } catch(e){}
  updatePills();
}

// 🪄 Integrar ao fluxo do site
const _abrirModalOriginal = abrirModal;
abrirModal = function(el){
  const id = el.dataset.modalId;
  const modal = document.getElementById(`modal-${id}`);
  if(!modal) return;
  fecharModal();
  modal.style.display='flex';
  modalAtivo=modal;
  modal.scrollTop=0;
  document.addEventListener('keydown', fecharPorEsc);
  modal.addEventListener('click', cliqueFora);
  if(id==='favoritos') renderModalFavoritos();
};
</script>

    font-size: clamp(0.88rem,1.6vw,1.38rem);
    text-align:left;
    margin-right: 4px;
  }
  #modal-resumo .resumo-item-titulo{
    margin: clamp(20px, 2vw, 35px) 6px 6px 10px;
  }
  #modal-resumo .resumo-item-preco{
    margin: 0 4px 0px 10px;
    font-weight:500;
    font-family:var(--ff-cta);
  }

  /* botão de edição ativo (modo exclusão rápida) */
  #resumo-editar.selecionando{
    background: var(--ink);
    color: var(--beige);
  }
</style>

<div id="modal-resumo" class="modal-overlay" style="display:none;">
  <div class="modal-content">

    <div class="modal-body">
      <h2 style="margin:0 0 12px 0;">APOSTAS SELECIONADAS</h2>

      <!-- TEXTO GUIA (sem total aqui) -->
      <div class="grupo">
      </div>
<div style="background: #2b2424; width: 100%, height: 1px; color: #2b2424; margin-bottom: 18px; font-size: 1px">_</div>
      <!-- RIFAS -->
      <div id="resumo-rifas" class="grupo">
        <div class="titulo">RIFAS</div>
        <div id="resumo-rifas-list" class="rifas"></div>
        <div id="resumo-rifas-fav-cta" style="display:none; margin-top:8px;">
          <a href="#"
             style="text-decoration: none;" onclick="event.preventDefault(); (window._fecharResumo||(()=>{}))(); if (typeof abrirModal==='function'){ try{ abrirModal({dataset:{modalId:'favoritos'}});}catch(e){ showPage('galeria'); } } else { showPage('galeria'); }">
                        <button style="border: 1px dashed red; background: white; padding: 18px;cursor:pointer; text-align: left; color: red; font-weight: 500;">
              <p style="margin:0 0 10px 0; margin-top: 8px; font-size:14px;line-height:1;text-align: left;">
                Antes de apostar, indique quantas peças favoritas quiser!
              </p>
              <p style="margin-top: 8px; font-size:14px;line-height:1;text-align: left;">
                Assim cada pessoa sorteada pode ganhar aquilo que mais gostou.
              </p>
              <p style="margin-top: 8px; font-size:14px;line-height:1;text-align: left;">
                <strong>Clique aqui</strong> para abrir a mini-galeria.
              </p>
            </button> 
          </a>
        </div>
      </div>

      <!-- TABS (PEÇAS / FAVORITAS) -->
      <div id="resumo-switch" class="grupo" style="display:none;">
        <button id="resumo-tab-pecas" class="chip is-active" type="button" aria-pressed="true">Peças</button>
        <button id="resumo-tab-favs"  class="chip"           type="button" aria-pressed="false">Favoritas</button>
      </div>

      <!-- LISTAS EM LINHAS (2 colunas) -->
      <div id="resumo-pecas" class="grupo" style="display:none;">
        <div class="titulo">PEÇAS</div>
        <div id="resumo-pecas-list" class="resumo-list"></div>
      </div>

      <div id="resumo-favs" class="grupo" style="display:none;">

        <div id="resumo-favs-list" class="resumo-list"></div>
      </div>
    </div>

    <!-- AÇÕES (fixo no rodapé do modal) -->
    <div class="grupo modal-actions">
      <button id="resumo-total-btn" class="chip is-active" type="button"
              style="background:var(--red);color:#fff;cursor:default; width: 100%; font:500 var(--fs-sm)/1.2 var(--ff-cta);border: 1px solid red;" disabled>
      </button>
      <button id="resumo-editar"     class="chip" type="button">EDITAR SELEÇÃO</button>
      <button id="resumo-prosseguir" class="chip is-active" type="button"
              style="background:var(--red);color:#fff; border: 1px solid red;">PROSSEGUIR</button>
    </div>
  </div>
</div>

<script>
window._resumoEditMode = false;

/* --- abertura/fechamento do modal --- */
(function(){
  function _open(){
    var m = document.getElementById('modal-resumo');
    if (!m) return;
    m.style.display = 'flex';
    document.addEventListener('keydown', _esc);
    m.addEventListener('click', _backdrop);
  }
  function _close(){
    var m = document.getElementById('modal-resumo');
    if (!m) return;
    m.style.display = 'none';
    document.removeEventListener('keydown', _esc);
    m.removeEventListener('click', _backdrop);
    window._resumoEditMode = false;
    atualizaEstadoBotaoEdicao();
  }
  function _esc(e){ if (e.key === 'Escape') _close(); }
  function _backdrop(e){ if (e.target && e.target.id === 'modal-resumo') _close(); }

  window._abrirResumo  = _open;
  window._fecharResumo = _close;
})();

/* --- aparência do botão EDITAR SELEÇÃO --- */
function atualizaEstadoBotaoEdicao(){
  var btn = document.getElementById('resumo-editar');
  if (!btn) return;
  if (window._resumoEditMode){
    btn.classList.add('selecionando');
    btn.textContent = 'CONCLUIR EDIÇÃO';
  } else {
    btn.classList.remove('selecionando');
    btn.textContent = 'EDITAR SELEÇÃO';
  }
}

/* --- monta a UI do resumo com os dados vivos em memória --- */
function renderResumoSelecoes(){
  try{
    if (typeof calcularTotal === 'function') calcularTotal();
    if (typeof updatePills === 'function')   updatePills();

    window._resumoEditMode = false;
    atualizaEstadoBotaoEdicao();

    var rifasList = document.getElementById('resumo-rifas-list');
    var pecasList = document.getElementById('resumo-pecas-list');
    var favsList  = document.getElementById('resumo-favs-list');
    var sw        = document.getElementById('resumo-switch');

    if (rifasList) rifasList.innerHTML = '';
    if (pecasList) pecasList.innerHTML = '';
    if (favsList)  favsList.innerHTML  = '';

    // --- RIFAS ---
    var hasRifas = false;
    if (typeof rifasSel !== 'undefined' && Array.isArray(rifas) && rifasList){
      (Array.from(rifasSel)).forEach(function(id){
        var r = rifas.find(function(x){ return x && (String(x.id_rifa)===String(id)); });
        if (!r) return;
        hasRifas = true;

        var btn = document.createElement('div');
        btn.className = 'rifa-btn selected';
        var cor = r.hex_rifa || r.hex || '#ccc';
        btn.style.backgroundColor = cor;
        if (typeof getContrastColor === 'function'){
          btn.style.color = getContrastColor(cor);
        }

        var rawLabel = (r.botao_rifa && String(r.botao_rifa).trim())
          ? String(r.botao_rifa).trim()
          : (r.numero || r.id_rifa || '').toString();
        rawLabel = rawLabel.replace(/^\s*X\s*/i,'').trim();

        if (typeof formatRifaLabelDOM === 'function'){
          btn.appendChild( formatRifaLabelDOM(rawLabel) );
        } else {
          btn.textContent = rawLabel;
        }

        btn.onclick = function(){
          if (!window._resumoEditMode) return;
          try{
            rifasSel.delete(r.id_rifa);
            if (typeof calcularTotal==='function') calcularTotal();
            if (typeof updatePills==='function')   updatePills();
            if (typeof handleHashChange==='function') handleHashChange();
            renderResumoSelecoes();
          }catch(e){ console.error(e); }
        };

        rifasList.appendChild(btn);
      });
    }

    var favCta = document.getElementById('resumo-rifas-fav-cta');
    if (favCta){
      var onlyR = hasRifas &&
                  (typeof selecionadas !== 'undefined' ? selecionadas.size === 0 : true) &&
                  (typeof favoritos    !== 'undefined' ? favoritos.size    === 0 : true);
      favCta.style.display = onlyR ? '' : 'none';
    }

    // --- PEÇAS ---
    var hasPecas = false;
    if (typeof selecionadas !== 'undefined' && Array.isArray(pecas) && pecasList){
      (Array.from(selecionadas))
        .map(function(id){
          return pecas.find(function(p){ return p && (String(p.id_peca)===String(id)); });
        })
        .filter(Boolean)
        .forEach(function(p){
          hasPecas = true;

          var row = document.createElement('div');
          row.className = 'resumo-item';

          var colImg = document.createElement('div');
          colImg.className = 'resumo-item-img';

          var imgId = (p.imagens && p.imagens.length) ? p.imagens[0] : null;
          if (imgId){
            var img = imgWithFallback(`https://betshoptv.github.io/img/tmb/${imgId}.avif`);
            img.alt = p.titulo || p.id_peca;
            colImg.appendChild(img);
          }

          var colInfo = document.createElement('div');
          colInfo.className = 'resumo-item-info';

          var tituloEl = document.createElement('div');
          tituloEl.className = 'resumo-item-titulo';
          tituloEl.textContent = p.titulo || ('Peça ' + p.id_peca);

          var precoEl = document.createElement('div');
          precoEl.className = 'resumo-item-preco';
          var preco = (typeof fmt === 'function') ? fmt(p.preco) : ('R$ ' + Math.round(p.preco||0));
          precoEl.textContent = preco;

          colInfo.appendChild(tituloEl);
          colInfo.appendChild(precoEl);

          row.appendChild(colImg);
          row.appendChild(colInfo);

          row.onclick = function(){
            if (!window._resumoEditMode) return;
            try{
              selecionadas.delete(p.id_peca);
              if (typeof calcularTotal==='function') calcularTotal();
              if (typeof updatePills==='function')   updatePills();
              if (typeof handleHashChange==='function') handleHashChange();
              renderResumoSelecoes();
            }catch(e){ console.error(e); }
          };

          pecasList.appendChild(row);
        });
    }

    // --- FAVORITAS ---
    var hasFavs = false;
    if (typeof favoritos !== 'undefined' && Array.isArray(pecas) && favsList){
      (Array.from(favoritos))
        .map(function(id){
          return pecas.find(function(p){ return p && (String(p.id_peca)===String(id)); });
        })
        .filter(Boolean)
        .forEach(function(p){
          hasFavs = true;

          var row = document.createElement('div');
          row.className = 'resumo-item';

          var colImg = document.createElement('div');
          colImg.className = 'resumo-item-img';

          var imgId = (p.imagens && p.imagens.length) ? p.imagens[0] : null;
          if (imgId){
            var img = imgWithFallback(`https://betshoptv.github.io/img/tmb/${imgId}.avif`);
            img.alt = p.titulo || p.id_peca;
            colImg.appendChild(img);
          }

          var colInfo = document.createElement('div');
          colInfo.className = 'resumo-item-info';

          var tituloEl = document.createElement('div');
          tituloEl.className = 'resumo-item-titulo';
          tituloEl.textContent = p.titulo || ('Peça ' + p.id_peca);

          colInfo.appendChild(tituloEl);

          row.appendChild(colImg);
          row.appendChild(colInfo);

          row.onclick = function(){
            if (!window._resumoEditMode) return;
            try{
              favoritos.delete(p.id_peca);
              if (typeof calcularTotal==='function') calcularTotal();
              if (typeof updatePills==='function')   updatePills();
              if (typeof handleHashChange==='function') handleHashChange();
              renderResumoSelecoes();
            }catch(e){ console.error(e); }
          };

          favsList.appendChild(row);
        });
    }

    // --- TOTAL NO BOTÃO DO RODAPÉ ---
    var tot = (typeof totalGeral !== 'undefined') ? totalGeral : 0;
    var totalBtn = document.getElementById('resumo-total-btn');
    if (totalBtn){
      var labelTot = (typeof fmt === 'function') ? fmt(tot) : ('R$ ' + Math.round(tot||0));
      totalBtn.textContent = 'TOTAL: ' + labelTot;
    }

    // --- TABS (Peças/Favoritas) ---
    var boxP = document.getElementById('resumo-pecas');
    var boxF = document.getElementById('resumo-favs');
    var tabP = document.getElementById('resumo-tab-pecas');
    var tabF = document.getElementById('resumo-tab-favs');

    if (boxP) boxP.style.display = hasPecas ? '' : 'none';
    if (boxF) boxF.style.display = (hasPecas && hasFavs) ? 'none' : (hasFavs ? '' : 'none');
    if (sw)   sw.style.display   = (hasPecas && hasFavs) ? '' : 'none';

    if (hasPecas && hasFavs && tabP && tabF){
      var selectTab = function(qual){
        var pOn = (qual === 'p');
        if (boxP) boxP.style.display = pOn ? '' : 'none';
        if (boxF) boxF.style.display = pOn ? 'none' : '';
        tabP.classList.toggle('is-active', pOn);
        tabP.setAttribute('aria-pressed', pOn ? 'true' : 'false');
        tabF.classList.toggle('is-active', !pOn);
        tabF.setAttribute('aria-pressed', !pOn ? 'true' : 'false');
      };
      selectTab('p');
      tabP.onclick = function(){ selectTab('p'); };
      tabF.onclick = function(){ selectTab('f'); };
    }

  }catch(err){ console.error('renderResumoSelecoes()', err); }
}

/* --- intercepta #ctaMain sem reescrever attachBindings() --- */
(function hookCTA(){
  function doHook(){
    var cta = document.getElementById('ctaMain');
    if (!cta) return setTimeout(doHook, 80);

    if (typeof cta.onclick !== 'function'){
      return setTimeout(doHook, 80);
    }

    var originalCTA = cta.onclick;
    if (cta._resumoHooked) return;
    cta._resumoHooked = true;

    cta.onclick = function(e){
      if (cta.disabled) return;
      e.preventDefault();

      renderResumoSelecoes();
      (window._abrirResumo||(()=>{}))();

      var btnEdit = document.getElementById('resumo-editar');
      var btnNext = document.getElementById('resumo-prosseguir');

      if (btnEdit){
        btnEdit.onclick = function(){
          window._resumoEditMode = !window._resumoEditMode;
          atualizaEstadoBotaoEdicao();
        };
      }

      if (btnNext){
        btnNext.onclick = function(){
          (window._fecharResumo||(()=>{}))();
          try{
            originalCTA.call(cta, new MouseEvent('click'));
          }catch(err){
            originalCTA();
          }
        };
      }
    };
  }
  doHook();
})();
</script>
