<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://betshoptv.github.io/FAVICON.png" type="image/x-icon">
    <title>BetShopTV - Guia de Montagem - Aposta 46</title>
    
    <!-- Importação da família completa da Roboto Semi Condensed -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. VARIÁVEIS E RESET
           ========================================= */
        :root {
            --red: #ff0000;
            --ink: #2b2424;
            --beige: #bebab0;
            --white: #ffffff;
            --ff-body: "Roboto Semi Condensed", sans-serif;
        }
        
        body, html {
            background: var(--beige);
            color: var(--ink);
            font-family: var(--ff-body);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* =========================================
           2. CONTÊINER MESTRE (Alinhamento global)
           ========================================= */
        /* Esta classe garante que o cabeçalho, a galeria e o PDF 
           tenham exatamente a mesma largura e alinhamento */
        .master-container {
            width: 95%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* =========================================
           3. CABEÇALHO
           ========================================= */
        .top-bar {
            background-color: var(--red);
            width: 100%;
            height: 100px; 
            box-sizing: border-box;
        }

        /* O interior do cabeçalho usa o master-container para alinhar com o resto */
        .top-bar-inner {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .bar-logo {
            height: 100%;
            width: auto;
            padding: 4px; /* Padding solicitado */
            box-sizing: border-box;
        }

        .bar-title {
            color: var(--white);
            font-size: 1.5rem;
            font-weight: 700; /* Peso 700 conforme solicitado */
            letter-spacing: 1px;
            margin: 0;
            flex-grow: 1; /* Ocupa todo o espaço restante */
            text-align: center; /* Centraliza no espaço restante */
        }

        /* =========================================
           4. TEXTO CENTRAL DE DESTAQUE
           ========================================= */
        .aposta-destaque {
            text-align: center;
            margin: 40px 0 20px 0;
            border-bottom: 1px solid rgba(43, 36, 36, 0.2);
            padding-bottom: 20px;
        }

        .aposta-destaque h2 {
            font-size: 1.8rem;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
        }

        .aposta-destaque p {
            font-size: 1.2rem;
            margin: 0;
            font-weight: 700;
        }

        /* =========================================
           5. GALERIA DE OBRAS
           ========================================= */
        .gallery-container {
            display: flex;
            flex-direction: row;
            justify-content: space-between; /* Distribui os itens na largura total */
            gap: 20px;
            flex-wrap: wrap; 
            padding-top: 20px;
        }

        .artwork-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .artwork-card img {
            height: 350px; /* Altura fixa */
            width: auto;   
            object-fit: contain;
            margin-bottom: 15px;
        }

        .artwork-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0 0 15px 0;
            line-height: 1.3;
            text-align: left;
            max-width: 250px;
        }

        /* =========================================
           6. BOTÕES
           ========================================= */
        .button-group {
            display: flex;
            flex-direction: row;
            gap: 10px;
        }

        .btn-action {
            display: inline-block;
            padding: 8px 15px;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-download {
            background-color: var(--ink);
            color: var(--beige);
        }

        .btn-download:hover {
            background-color: var(--red);
            color: var(--white);
        }

        .btn-view {
            background-color: transparent;
            color: var(--ink);
            border: 2px solid var(--ink);
        }

        .btn-view:hover {
            background-color: var(--ink);
            color: var(--beige);
        }

        /* =========================================
           7. VISUALIZADOR DE PDF
           ========================================= */
        .pdf-viewer-section {
            display: none; /* Escondido por padrão */
            flex-direction: column;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        .btn-fechar-pdf {
            align-self: flex-end;
            background-color: var(--red);
            color: var(--white);
            border: none;
            padding: 8px 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 0;
        }

        /* Contêiner onde o <embed> será injetado pelo JS */
        .pdf-embed-container {
            width: 100%;
            height: 80vh; /* Altura relativa ao tamanho da tela */
            border: 2px solid var(--ink);
            background-color: #e5e5e5;
            box-sizing: border-box;
        }

    </style>
</head>
<body>

    <!-- Cabeçalho (Usando master-container internamente) -->
    <header class="top-bar">
        <div class="top-bar-inner master-container">
            <img src="https://betshoptv.github.io/elementos/logo-bstv.png" alt="BetShopTV" class="bar-logo">
            <h1 class="bar-title">GUIA DE MONTAGEM E CONSERVAÇÃO</h1>
        </div>
    </header>

    <!-- Destaque da Aposta (Usando master-container) -->
    <div class="aposta-destaque master-container">
        <h2>PEÇAS ESCOLHIDAS</h2>
        <p>Aposta nº 46</p>
    </div>

    <!-- Galeria de Obras (Usando master-container) -->
    <main class="gallery-container master-container" id="gallery-container"></main>

    <!-- Visualizador de PDF (Usando master-container para alinhar com a galeria) -->
    <section class="pdf-viewer-section master-container" id="pdf-viewer-section">
        <button class="btn-fechar-pdf" onclick="fecharVisualizador()">FECHAR VISUALIZAÇÃO X</button>
        <!-- A tag embed será gerada aqui via JavaScript -->
        <div class="pdf-embed-container" id="pdf-embed-wrapper"></div>
    </section>

    <script>
        // Array com os IDs da aposta
        const idsDisponiveis = ["0507", "0611", "0613", "0706"];

        async function carregarEFiltrarObras() {
            try {
                // Busca os dados oficiais
                const resposta = await fetch('https://betshoptv.github.io/dados/pecas.json');
                const dadosJson = await resposta.json();

                // Filtra as peças pela lista de IDs
                const pecasFiltradas = dadosJson.filter(peca => idsDisponiveis.includes(peca.id_peca));
                
                renderizarGaleria(pecasFiltradas);
            } catch (erro) {
                console.error("Erro ao cruzar o banco de dados:", erro);
            }
        }

        function renderizarGaleria(pecas) {
            const container = document.getElementById('gallery-container');

            pecas.forEach(peca => {
                const nomeDaImagem = (peca.imagens && peca.imagens.length > 0) ? peca.imagens[0] : 'fallback';
                
                const urlImagem = `https://betshoptv.github.io/img/fallback/${nomeDaImagem}.jpg`;
                const urlPdf = `https://betshoptv.github.io/pdf/${peca.id_peca}.pdf`;

                const card = document.createElement('div');
                card.className = 'artwork-card';

                card.innerHTML = `
                    <img src="${urlImagem}" alt="${peca.titulo}">
                    <h2 class="artwork-title">${peca.titulo}</h2>
                    <div class="button-group">
                        <a href="${urlPdf}" download="BetShopTV_Guia_de_Montagem_${peca.id_peca}.pdf" class="btn-action btn-download">BAIXAR PDF</a>
                        <button onclick="abrirVisualizador('${urlPdf}')" class="btn-action btn-view">VISUALIZAR</button>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Nova Função de Visualização: Injeta <embed> ao invés de usar <iframe>
        function abrirVisualizador(urlDoPdf) {
            const viewerSection = document.getElementById('pdf-viewer-section');
            const wrapper = document.getElementById('pdf-embed-wrapper');
            
            // Injeta o HTML do embed no DOM, forçando o navegador a usar o plugin nativo de PDF
            wrapper.innerHTML = `<embed src="${urlDoPdf}" type="application/pdf" width="100%" height="100%">`;
            
            viewerSection.style.display = 'flex';
            viewerSection.scrollIntoView({ behavior: 'smooth' });
        }

        function fecharVisualizador() {
            const viewerSection = document.getElementById('pdf-viewer-section');
            const wrapper = document.getElementById('pdf-embed-wrapper');
            
            // Remove o embed da memória e esconde a seção
            wrapper.innerHTML = "";
            viewerSection.style.display = 'none';
        }

        // Inicializa a página
        carregarEFiltrarObras();
    </script>
</body>
</html>
