<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://betshoptv.github.io/FAVICON.png" type="image/x-icon">
    <title>BetShopTV - Aposta 46wm</title>
    <style>
        /* 1. VARIÁVEIS E RESET */
        :root {
            --red: #ff0000;
            --ink: #2b2424;
            --beige: #bebab0;
            --white: #ffffff;
            --ff-body: "Roboto SemiCondensed", sans-serif;
        }
        
        body, html {
            background: var(--beige);
            color: var(--ink);
            font-family: var(--ff-body);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* 2. CABEÇALHO (Mais robusto, logo maior à direita) */
.top-bar {
            background-color: var(--red);
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: flex-start; /* Mudança principal aqui */
            align-items: center;
            padding: 0 4%; 
            box-sizing: border-box;
        }

        .bar-title {
            color: var(--white);
            font-size: 1.5rem;
            font-weight: normal;
            letter-spacing: 1px;
            margin: 0;
        }

        .bar-logo {
            height: 100%; /* Ocupa a altura total do cabeçalho */
            width: auto;
            padding: 4px; /* O padding exato solicitado */
            box-sizing: border-box; /* Garante que o padding não estoure a altura */
            margin-right: 120px; /* Dá um respiro entre o logotipo e o texto */
        }

        /* 3. TEXTO CENTRAL DE DESTAQUE */
        .aposta-destaque {
            text-align: center;
            margin: 40px 0 40px 0;

        }

        .aposta-destaque h2 {
            font-size: 1.8rem;
            margin: 0 0 5px 0;
            letter-spacing: 1.5px;
            color: var(--ink);
            font-weight: 700;
        }

        .aposta-destaque p {
            font-size: 1.2rem;
            margin: 0;
            color: var(--red);
        }

        /* 4. GALERIA (Imagens com altura fixa) */
        .gallery-container {
            width: 92%;
            margin: 30px auto;
            display: flex;
            flex-direction: row;
            justify-content: center; /* Centraliza o bloco de obras */
            gap: 40px;
            flex-wrap: wrap; /* Permite quebrar linha em telas menores */
        }

        .artwork-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Mantém título e botões alinhados à esquerda da imagem */
        }

        .artwork-card img {
            height: 350px; /* ALTURA FIXA PARA TODAS AS IMAGENS */
            width: auto;   /* LARGURA VARIÁVEL (adapta à proporção) */
            object-fit: contain;
            margin-bottom: 15px;
            background-color: var(--beige); /* Remove qualquer fundo branco excedente */
        }

        .artwork-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0 0 15px 0;
            line-height: 1.3;
            text-align: left;
            max-width: 250px; /* Evita que títulos muito longos estiquem o layout */
        }

        /* 5. GRUPO DE BOTÕES */
        .button-group {
            display: flex;
            flex-direction: row;
            gap: 10px;
        }

        .btn-action {
            display: inline-block;
            padding: 8px 15px;
            font-size: 0.9rem;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-download {
            background-color: var(--ink);
            color: var(--beige);
        }

        .btn-download:hover {
            background-color: var(--red);
            color: var(--white);
        }

        .btn-view {
            background-color: transparent;
            color: var(--ink);
            border: 2px solid var(--ink);
        }

        .btn-view:hover {
            background-color: var(--ink);
            color: var(--beige);
        }

        /* 6. VISUALIZADOR DE PDF (Iframe) */
        .pdf-viewer-section {
            width: 92%;
            margin: 40px auto;
            display: none; /* Escondido por padrão, aparece ao clicar em VISUALIZAR */
            flex-direction: column;
            align-items: center;
        }

        .btn-fechar-pdf {
            align-self: flex-end;
            background-color: var(--red);
            color: white;
            border: none;
            padding: 5px 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .pdf-viewer-section iframe {
            width: 100%;
            height: 70vh; /* Ocupa 70% da altura da tela */
            border: 2px solid var(--ink);
        }

    </style>
</head>
<body>

    <!-- Cabeçalho -->
<!-- Cabeçalho -->
    <header class="top-bar">
        <img src="https://betshoptv.github.io/elementos/logo-bstv.png" alt="BetShopTV" class="bar-logo">
        <h1 class="bar-title">GUIA DE MONTAGEM E CONSERVAÇÃO</h1>
    </header>

    <!-- Destaque da Aposta -->
    <div class="aposta-destaque">
        <h2>PEÇAS ESCOLHIDAS</h2>
        <p style="font-weight: 400; color: var(--ink);">Aposta nº 46</p>
    </div>
<div style="
            border-top: 1px solid var(--ink);"></div>
    <!-- Galeria de Obras -->
    <main class="gallery-container" id="gallery-container"></main>

    <!-- Visualizador Embutido de PDF -->
    <section class="pdf-viewer-section" id="pdf-viewer-section">
        <button class="btn-fechar-pdf" onclick="fecharVisualizador()">FECHAR VISUALIZAÇÃO X</button>
        <iframe id="pdf-iframe" src=""></iframe>
    </section>

    <script>
        // Array com os IDs da aposta
        const idsDisponiveis = ["0507", "0611", "0613", "0706"];

        async function carregarEFiltrarObras() {
            try {
                // Busca os dados oficiais
                const resposta = await fetch('https://betshoptv.github.io/dados/pecas.json');
                const dadosJson = await resposta.json();

                // Filtra as peças pela lista de IDs
                const pecasFiltradas = dadosJson.filter(peca => idsDisponiveis.includes(peca.id_peca));
                
                renderizarGaleria(pecasFiltradas);
            } catch (erro) {
                console.error("Erro ao cruzar o banco de dados:", erro);
            }
        }

        function renderizarGaleria(pecas) {
            const container = document.getElementById('gallery-container');

            pecas.forEach(peca => {
                const nomeDaImagem = (peca.imagens && peca.imagens.length > 0) ? peca.imagens[0] : 'fallback';
                
                const urlImagem = `https://betshoptv.github.io/img/fallback/${nomeDaImagem}.jpg`;
                const urlPdf = `https://betshoptv.github.io/pdf/${peca.id_peca}.pdf`;

                // Cria o contêiner do card
                const card = document.createElement('div');
                card.className = 'artwork-card';

                // Preenche o card com a imagem, título e os dois botões
                card.innerHTML = `
                    <img src="${urlImagem}" alt="${peca.titulo}">
                    <h2 class="artwork-title">${peca.titulo}</h2>
                    <div class="button-group">
                        <a href="${urlPdf}" download="Guia_${peca.id_peca}.pdf" class="btn-action btn-download">BAIXAR PDF</a>
                        <button onclick="abrirVisualizador('${urlPdf}')" class="btn-action btn-view">VISUALIZAR</button>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Função que aciona o Iframe para visualização rápida
        function abrirVisualizador(urlDoPdf) {
            const viewerSection = document.getElementById('pdf-viewer-section');
            const iframe = document.getElementById('pdf-iframe');
            
            // Injeta a URL do PDF no Iframe
            iframe.src = urlDoPdf;
            
            // Exibe a seção na tela (muda de 'none' para 'flex')
            viewerSection.style.display = 'flex';
            
            // Rola a tela suavemente para baixo, até o visualizador
            viewerSection.scrollIntoView({ behavior: 'smooth' });
        }

        // Função para esconder o visualizador
        function fecharVisualizador() {
            const viewerSection = document.getElementById('pdf-viewer-section');
            const iframe = document.getElementById('pdf-iframe');
            
            // Limpa o src e esconde a seção
            iframe.src = "";
            viewerSection.style.display = 'none';
        }

        // Inicializa a página
        carregarEFiltrarObras();
    </script>
</body>
</html>
